{
  "version": 2,
  "latestExtensionVersion": "1.0.2",

  "settings": {
    "githubCheckIntervalMinutes": 30,
    "overlayFrequencyMinutes": 1,
    "quizzesToUnlock": 1,
    "triesPerWord": 3
  },

  "sounds": {
    "prompt": "assets/audio/phrases/prompt.mp3",
    "correct": [
      "assets/audio/phrases/correct-1.mp3",
      "assets/audio/phrases/correct-2.mp3",
      "assets/audio/phrases/correct-3.mp3"
    ],
    "tryAgain": "assets/audio/phrases/try-again.mp3",
    "newWord": "assets/audio/phrases/new-word.mp3",
    "anotherOne": "assets/audio/phrases/another-one.mp3",
    "unlocked": "assets/audio/phrases/unlocked.mp3"
  },

  "words": [
    { "word": "car",   "distractors": ["cat", "jar", "far"],     "image": "assets/images/car.webp",   "audio": "assets/audio/words/car.mp3",   "prompt": "a shiny red toy-style car, side view" },
    { "word": "house", "distractors": ["mouse", "horse", "hose"], "image": "assets/images/house.webp", "audio": "assets/audio/words/house.mp3", "prompt": "a small cozy house with a red roof, a door and two windows" },
    { "word": "can",   "distractors": ["cap", "fan", "man"],     "image": "assets/images/can.webp",   "audio": "assets/audio/words/can.mp3",   "prompt": "a metal tin can of soup with a plain blank colored label" },
    { "word": "dog",   "distractors": ["bog", "dig", "dot"],     "image": "assets/images/dog.webp",   "audio": "assets/audio/words/dog.mp3",   "prompt": "a happy brown puppy dog sitting and wagging its tail" },
    { "word": "cat",   "distractors": ["bat", "cot", "hat"],     "image": "assets/images/cat.webp",   "audio": "assets/audio/words/cat.mp3",   "prompt": "a cute orange cat sitting" },
    { "word": "bed",   "distractors": ["dab", "bad", "red"],     "image": "assets/images/bed.webp",   "audio": "assets/audio/words/bed.mp3",   "prompt": "a cozy bed with a fluffy pillow and a blue blanket" },
    { "word": "ball", "distractors": ["doll", "bell", "tall"],  "image": "assets/images/ball.webp", "audio": "assets/audio/words/ball.mp3", "prompt": "a bouncy red and white striped ball" },
    { "word": "duck", "distractors": ["buck", "dock", "truck"], "image": "assets/images/duck.webp", "audio": "assets/audio/words/duck.mp3", "prompt": "a cheerful yellow duck standing" },
    { "word": "drum", "distractors": ["drip", "plum", "brim"],  "image": "assets/images/drum.webp", "audio": "assets/audio/words/drum.mp3", "prompt": "a red toy drum with two wooden drumsticks" },
    { "word": "bird", "distractors": ["dirt", "bead", "burn"],  "image": "assets/images/bird.webp", "audio": "assets/audio/words/bird.mp3", "prompt": "a little blue bird perched on a branch" },
    { "word": "boat", "distractors": ["goat", "coat", "beat"],  "image": "assets/images/boat.webp", "audio": "assets/audio/words/boat.mp3", "prompt": "a little sailboat with a white sail floating on blue water" },
    { "word": "bath", "distractors": ["path", "math", "bat"],   "image": "assets/images/bath.webp", "audio": "assets/audio/words/bath.mp3", "prompt": "a white bathtub overflowing with foamy soap bubbles" },
    { "word": "moth", "distractors": ["math", "most", "mop"],   "image": "assets/images/moth.webp", "audio": "assets/audio/words/moth.mp3", "prompt": "a fuzzy brown and cream moth with feathery antennae flying near a glowing light bulb (clearly a moth, not a butterfly)" },
    { "word": "teeth", "distractors": ["tooth", "teach", "tenth"], "image": "assets/images/teeth.webp", "audio": "assets/audio/words/teeth.mp3", "prompt": "a big smiling mouth showing two neat rows of shiny white teeth" },
    { "word": "thumb", "distractors": ["thump", "them", "dumb"],  "image": "assets/images/thumb.webp", "audio": "assets/audio/words/thumb.mp3", "prompt": "a hand giving a big thumbs-up" },
    { "word": "three", "distractors": ["tree", "there", "free"],  "image": "assets/images/three.webp", "audio": "assets/audio/words/three.mp3", "prompt": "exactly three identical shiny red apples in a row (no numerals)" },
    { "word": "pig",   "distractors": ["big", "dig", "peg"],     "image": "assets/images/pig.webp",   "audio": "assets/audio/words/pig.mp3",   "prompt": "a happy pink pig standing" },
    { "word": "desk", "distractors": ["disk", "deck", "best"],  "image": "assets/images/desk.webp", "audio": "assets/audio/words/desk.mp3", "prompt": "a wooden school desk with a chair and a pencil on top" },
    { "word": "bee",   "distractors": ["dee", "see", "pea"],     "image": "assets/images/bee.webp",   "audio": "assets/audio/words/bee.mp3",   "prompt": "a smiling fuzzy yellow and black bumblebee flying" },
    { "word": "fish", "distractors": ["dish", "wish", "fist"],  "image": "assets/images/fish.webp", "audio": "assets/audio/words/fish.mp3", "prompt": "a bright orange fish swimming with bubbles" },
    { "word": "bus",   "distractors": ["bug", "bun", "dust"], "image": "assets/images/bus.webp", "audio": "assets/audio/words/bus.mp3", "prompt": "a bright yellow school bus, side view" },
    { "word": "bear", "distractors": ["dear", "pear", "bead"], "image": "assets/images/bear.webp", "audio": "assets/audio/words/bear.mp3", "prompt": "a friendly brown bear sitting" },
    { "word": "bike", "distractors": ["like", "bake", "dime"], "image": "assets/images/bike.webp", "audio": "assets/audio/words/bike.mp3", "prompt": "a red bicycle, side view" },
    { "word": "bread", "distractors": ["break", "bead", "dread"], "image": "assets/images/bread.webp", "audio": "assets/audio/words/bread.mp3", "prompt": "a loaf of bread with one slice cut off" },
    { "word": "book", "distractors": ["look", "cook", "dock"], "image": "assets/images/book.webp", "audio": "assets/audio/words/book.mp3", "prompt": "an open storybook with colorful blank pages (no writing)" },
    { "word": "frog", "distractors": ["from", "flag", "fog"], "image": "assets/images/frog.webp", "audio": "assets/audio/words/frog.mp3", "prompt": "a happy green frog sitting on a lily pad" },
    { "word": "sheep", "distractors": ["sleep", "cheep", "shop"], "image": "assets/images/sheep.webp", "audio": "assets/audio/words/sheep.mp3", "prompt": "a fluffy white sheep standing on green grass" },
    { "word": "chick", "distractors": ["check", "chin", "thick"], "image": "assets/images/chick.webp", "audio": "assets/audio/words/chick.mp3", "prompt": "a tiny fluffy yellow baby chick" },
    { "word": "moon", "distractors": ["noon", "moan", "mood"], "image": "assets/images/moon.webp", "audio": "assets/audio/words/moon.mp3", "prompt": "a big glowing yellow crescent moon on a plain dark blue night background" },
    { "word": "star", "distractors": ["stir", "scar", "tar"], "image": "assets/images/star.webp", "audio": "assets/audio/words/star.mp3", "prompt": "one big shiny yellow five-pointed star" },
    { "word": "shell", "distractors": ["sell", "shall", "smell"], "image": "assets/images/shell.webp", "audio": "assets/audio/words/shell.mp3", "prompt": "a pink and white scallop seashell on sand" },
    { "word": "crab", "distractors": ["crib", "grab", "drab"], "image": "assets/images/crab.webp", "audio": "assets/audio/words/crab.mp3", "prompt": "a red crab with big claws on beach sand" },
    { "word": "cake", "distractors": ["bake", "lake", "make"], "image": "assets/images/cake.webp", "audio": "assets/audio/words/cake.mp3", "prompt": "a birthday cake with pink frosting and lit candles" },
    { "word": "queen", "distractors": ["green", "quit", "seen"], "image": "assets/images/queen.webp", "audio": "assets/audio/words/queen.mp3", "prompt": "a smiling queen wearing a golden crown and a purple robe" },
    { "word": "bell", "distractors": ["ball", "doll", "belt"], "image": "assets/images/bell.webp", "audio": "assets/audio/words/bell.mp3", "prompt": "a shiny golden bell with a red bow on top" },
    { "word": "web",   "distractors": ["wed", "wet", "dew"], "image": "assets/images/web.webp", "audio": "assets/audio/words/web.mp3", "prompt": "a round spider web with a small cute spider in the middle" },
    { "word": "mouse", "distractors": ["house", "moose", "mouth"], "image": "assets/images/mouse.webp", "audio": "assets/audio/words/mouse.mp3", "prompt": "a cute grey mouse (the animal) with big round ears and a long tail" },
    { "word": "sock", "distractors": ["rock", "sack", "lock"], "image": "assets/images/sock.webp", "audio": "assets/audio/words/sock.mp3", "prompt": "a single colorful striped sock" },
    { "word": "nest", "distractors": ["best", "next", "rest"], "image": "assets/images/nest.webp", "audio": "assets/audio/words/nest.mp3", "prompt": "a bird nest made of twigs with three blue eggs inside" },
    { "word": "shoe", "distractors": ["show", "she", "toe"], "image": "assets/images/shoe.webp", "audio": "assets/audio/words/shoe.mp3", "prompt": "a single red sneaker shoe" }
  ]
}
